# Single repo-wide SonarQube Cloud project. sonar.organization/sonar.projectKey
# are passed in via -D args in sonar_scan.yml (from vars.SONAR_ORGANIZATION/
# vars.SONAR_PROJECT_KEY) rather than hardcoded here.

# Sources and tests both start at the repo root; test files are split out by
# pattern so each file is analyzed as exactly one of the two.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,**/vendor/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go coverage, produced by `go test -coverprofile` in sonar_scan.yml. Paths
# in the profile are module import paths; the Go analyzer maps them to files
# using Source/graphql-api/go.mod.
sonar.go.coverage.reportPaths=Source/graphql-api/coverage.out

# Code that has no unit tests by design, so it shouldn't lower coverage:
#   - SQL schema/functions (not covered by Go tests)
#   - cmd/ entry points (wiring only)
#   - gqlgen output (generated.go, models_gen.go, *_gen.go)
sonar.coverage.exclusions=\
  Source/DB/**,\
  Source/graphql-api/cmd/**,\
  **/generated.go,\
  **/*_gen.go,\
  **/generated/**

# Generated code is repetitive by nature; don't report it as duplication.
sonar.cpd.exclusions=**/generated.go,**/*_gen.go,**/generated/**
