services:
  netwatch-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-netwatch}
      POSTGRES_USER: ${DB_USER:-netwatch}
      POSTGRES_PASSWORD: ${DB_PWD:?Set DB_PWD in .env}
    ports:
      - "127.0.0.1:25432-25435:5432"
    volumes:
      - ${DATA_PATH}/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  netwatch-db-config:
    image: postgres:17-alpine
    depends_on:
      netwatch-db:
        condition: service_healthy
    environment:
      PGHOST: netwatch-db
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:-netwatch}
      PGUSER: ${DB_USER:-netwatch}
      PGPASSWORD: ${DB_PWD:?Set DB_PWD in .env}
    volumes:
      - ./Source/DB:/db:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for f in /db/tables/*.sql /db/stored_procedures/*.sql; do
        [ -f "$$f" ] || continue
        psql -v ON_ERROR_STOP=1 -f "$$f"
        done
    restart: "no"

