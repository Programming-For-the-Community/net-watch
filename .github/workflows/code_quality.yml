# Automatic code-quality checks. Runs on every push to any branch.
#
# Also callable from deploy.yml, which runs it with the quality gate
# enforced before building images. Add lint/test jobs here as the desktop
# app comes together (e.g. npm test), and add them to sonar's `needs:`.

name: Code Quality

on:
  push:
  workflow_call:
    inputs:
      wait_for_quality_gate:
        description: 'Fail if the SonarQube Cloud quality gate fails'
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

# One run per branch at a time; a newer push cancels the older run.
# Prefixed with the triggering workflow's name, so a deploy calling this
# workflow doesn't cancel (or get cancelled by) a push-triggered run.
concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphql-api:
    name: graphql-api lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Source/graphql-api
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: Source/graphql-api/go.mod
          # No go.sum yet (no third-party modules); switch this on once
          # there is one.
          cache: false

      # Uses Source/graphql-api/.golangci.yml; also fails on unformatted
      # files (gofmt/goimports).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
          working-directory: Source/graphql-api

      - name: Test
        run: go test -race ./...

  sonar:
    name: SonarQube Cloud
    # Every branch is analyzed (branch analysis is free for public
    # projects). Only main's scan can fail this job -- see sonar_scan.yml.
    # Don't scan code that fails lint or tests.
    needs: graphql-api
    uses: ./.github/workflows/sonar_scan.yml
    with:
      # Advisory on pushes; enforced when deploy.yml calls this workflow.
      wait_for_quality_gate: ${{ inputs.wait_for_quality_gate || false }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
