# Automatic code-quality checks.
#
#   push (any branch)    lint + tests; SonarQube Cloud scan on main only
#   pull_request → main  SonarQube Cloud PR analysis only (lint + tests
#                        already ran on the push to the PR's branch)
#
# The SonarQube Cloud Free plan analyzes only the main branch and pull
# requests, so pushes to other branches (e.g. dev) aren't scanned; their
# changes are analyzed when a PR into main is opened or updated.
#
# Also callable from deploy.yml, which runs it with the quality gate
# enforced before building images. Add lint/test jobs here as the desktop
# app comes together (e.g. npm test), and add them to sonar's `needs:`.

name: Code Quality

on:
  push:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      wait_for_quality_gate:
        description: 'Fail if the SonarQube Cloud quality gate fails'
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

# One run per branch at a time; a newer push cancels the older run.
# Prefixed with the triggering workflow's name, so a deploy calling this
# workflow doesn't cancel (or get cancelled by) a push-triggered run.
concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphql-api:
    name: graphql-api lint & test
    # Already ran on the push to the PR's branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Source/graphql-api
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: Source/graphql-api/go.mod
          # No go.sum yet (no third-party modules); switch this on once
          # there is one.
          cache: false

      # Uses Source/graphql-api/.golangci.yml; also fails on unformatted
      # files (gofmt/goimports).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15
          working-directory: Source/graphql-api

      - name: Test
        run: go test -race ./...

  sonar:
    name: SonarQube Cloud
    # Runs for main and for PRs into main (the Free plan rejects other
    # branches). Don't scan code that fails lint or tests: !failure()
    # lets this run when graphql-api was skipped (PRs) but not when it
    # failed. PRs from forks are skipped; they can't read SONAR_TOKEN.
    needs: graphql-api
    if: >-
      ${{ !failure() && !cancelled() &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)) }}
    uses: ./.github/workflows/sonar_scan.yml
    with:
      # Enforced on PRs (a failing gate fails the PR check) and when
      # deploy.yml calls this workflow; advisory on pushes to main.
      wait_for_quality_gate: ${{ inputs.wait_for_quality_gate || github.event_name == 'pull_request' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
