# Dependabot version updates.
#
# PRs target dev (not main) so updates flow through the normal
# dev -> main PR like any other change. Workflows triggered by Dependabot
# can only read secrets stored under Settings > Secrets > Dependabot.
#
# Actions are pinned to full commit SHAs with a "# vX.Y.Z" comment;
# Dependabot updates both the SHA and the comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    # One PR per month covering every action update.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

